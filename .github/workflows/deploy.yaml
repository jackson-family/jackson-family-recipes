name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: sh ci/build.sh

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
